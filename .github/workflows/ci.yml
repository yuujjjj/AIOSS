name: Sample CI

on:
  push:
  pull_request:

jobs:
  sample-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Run sample tests
        working-directory: sample-solutions-minimal/sample-3-testing
        run: python -m pytest -q

      - name: Run sample lint
        run: |
          ruff check sample-solutions-minimal/sample-1-collaboration
          ruff check sample-solutions-minimal/sample-3-testing
